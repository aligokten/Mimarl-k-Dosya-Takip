name: Build macOS Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "macos-v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG (Apple Silicon)
    # macos-14 ve sonrası Apple Silicon; uygulama M serisi işlemcilerde
    # yerel (arm64) çalışsın diye bu çalıştırıcı kullanılıyor.
    runs-on: macos-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build macOS installer
        # Apple Developer sertifikası yok; electron-builder anahtarlıkta
        # sertifika aramasın, aksi halde imzalama adımında hata veriyor.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ruhsat360-macOS
          path: desktop/release/*.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.dmg
          name: Ruhsat360 macOS ${{ github.ref_name }}
          body: |
            Ruhsat360 macOS masaüstü uygulaması (Apple Silicon / arm64).

            Uygulama Apple tarafından imzalanmadığı için ilk açılışta macOS
            "uygulama zarar görmüş" uyarısı verebilir. Bir defaya mahsus
            Terminal'de şu komutu çalıştırın:

                xattr -dr com.apple.quarantine /Applications/Ruhsat360.app
