<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // "Masaüstü Web Sitesi İste" açıkken tarayıcı viewport etiketini yok
      // sayıp geniş bir masaüstü genişliği zorluyor. Bunu düzeltiyoruz; ancak
      // YALNIZCA o durumda.
      //
      // Önceki sürüm viewport'a koşulsuz "width=<screen.width>" yazıyordu.
      // screen.width güvenilir bir CSS genişliği değil (cihaza göre fiziksel
      // piksel ya da yöne göre sabit bir değer dönebiliyor); gerçek yerleşim
      // genişliğinden küçük geldiğinde sayfa ekranı doldurmayıp sağda ölü
      // boşluk bırakıyordu. Artık yalnızca yerleşim genişliği cihaz
      // ekranından belirgin biçimde büyükse (masaüstü site belirtisi)
      // müdahale ediliyor, diğer tüm hâllerde width=device-width korunuyor.
      (function () {
        var VARSAYILAN = "width=device-width, initial-scale=1.0";
        var vp = document.querySelector('meta[name="viewport"]');
        if (!vp) return;
        function duzelt() {
          try {
            var ekran = window.screen && window.screen.width;
            var yerlesim = document.documentElement.clientWidth;
            if (!ekran || !yerlesim) return;
            if (yerlesim > ekran * 1.5) {
              vp.setAttribute("content", "width=" + ekran + ", initial-scale=1.0");
            } else if (vp.getAttribute("content") !== VARSAYILAN) {
              vp.setAttribute("content", VARSAYILAN);
            }
          } catch (e) {}
        }
        duzelt();
        window.addEventListener("resize", duzelt);
        window.addEventListener("orientationchange", duzelt);
        document.addEventListener("DOMContentLoaded", duzelt);
      })();
    </script>
    <script>
      // Tema sınıfını React yüklenmeden önce uygula; aksi halde koyu tema
      // kullanıcısında bir kare boyunca açık zemin görünüp göz alıyor.
      (function () {
        try {
          var stored = localStorage.getItem("mimarlik-theme");
          if (stored !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta name="color-scheme" content="dark light" />
    <meta
      name="theme-color"
      content="#161316"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="theme-color" content="#fdf7f3" />
    <title>Ruhsat360</title>
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta
      name="description"
      content="Ruhsat360 — mimari proje, akustik rapor ve yapı ruhsatı süreçlerinin dosya ve evrak takibi"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
